<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Produtos - PetShop</title>
    <link rel="stylesheet" href="../static/style.css">

  <!-- Favicon-->
  <link rel="icon" type="image/x-icon" href="../static/img/favicon.ico" />

</head>
<body>
    
    <!--Icon-->
    <a href="../templates/index.html" class="mt-3">
        <svg xmlns="http://www.w3.org/2000/svg" id="Isolation_Mode" data-name="Isolation Mode" viewBox="0 0 24 24"
            width="20" height="20">
            <path
                d="M7.065,7.727l-2.78,2.78L24,10.532l0,3L4.3,13.507l2.765,2.764-2.121,2.12L1.025,14.474a3.5,3.5,0,0,1,0-4.949L4.944,5.607Z" />
        </svg>
    </a>  

    <section class="produtos container my-5">
        <h2 class="mb-4">Nossos Produtos</h2>
        
        <div class="filtros mb-4">
            <a href="#" class="btn btn-outline-secondary btn-sm">Todos</a>
            <a href="#" class="btn btn-outline-secondary btn-sm">Alimentos</a>
            <a href="#" class="btn btn-outline-secondary btn-sm">Brinquedos</a>
            <a href="#" class="btn btn-outline-secondary btn-sm">Acessórios</a>
            <a href="#" class="btn btn-outline-secondary btn-sm">Higiene</a>
        </div>
        
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="card h-100 shadow-sm">
                    <img src="{{ url_for('static', filename='img/' + produto.imagem) }}"
                         class="card-img-top"
                         alt="{{ produto.nome }}"
                         style="object-fit: cover; height: 180px;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ produto.nome }}</h5>
                        <p class="card-text text-danger font-weight-bold">
                            R$ {{ "%.2f"|format(produto.preco) }}
                        </p>
                        <a href="{{ url_for('produto_detalhes', id=produto.id) }}"
                           class="btn btn-primary mt-auto">
                           Ver Detalhes
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div class="alert alert-info text-center">
                    Nenhum produto encontrado nesta categoria.
                </div>
            </div>
        </div>
    </section>
    
</body>
</html>
